:root{--green:#16a34a;--red:#dc2626;--grey:#6b7280;--blue:#2563eb;--gold:#f59e0b;--bg:#f1f5f9;--card:#fff;--text:#1e293b;--sub:#64748b;--border:#e2e8f0;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.08)}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh}
.hidden{display:none!important}
#loadingScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:linear-gradient(135deg,#0f172a,#1e3a5f,#2563eb)}
.spinner{width:44px;height:44px;border:4px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:rgba(255,255,255,.8);font-size:.9rem;font-weight:600}
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#0f172a,#1e3a5f,#2563eb)}
.login-card{background:#fff;border-radius:20px;padding:36px 28px;width:100%;max-width:380px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.25)}
.login-logo{font-size:2rem;font-weight:900;color:#2563eb;letter-spacing:2px}
.login-sub{color:var(--sub);margin:4px 0;font-size:.85rem;font-weight:600;letter-spacing:1px;text-transform:uppercase}
.login-tagline{color:#94a3b8;font-size:.78rem;margin-bottom:24px}
.user-select{display:grid;gap:8px;margin-bottom:16px}
.user-btn{padding:12px 14px;border:2px solid var(--border);border-radius:12px;background:#f8fafc;cursor:pointer;font-size:.95rem;font-weight:600;transition:.2s;text-align:left;display:flex;align-items:center;gap:10px;width:100%}
.user-btn:hover{border-color:#2563eb;background:#eff6ff}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:700;color:#fff;flex-shrink:0}
.pin-label{font-size:.88rem;color:var(--sub);margin-bottom:10px}
.pin-display{display:flex;gap:10px;justify-content:center;margin-bottom:16px}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);background:#f1f5f9;transition:.2s}
.pin-dot.filled{background:#2563eb;border-color:#2563eb}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pin-key{padding:15px;border:none;border-radius:10px;background:#f1f5f9;font-size:1.2rem;font-weight:700;cursor:pointer}
.pin-key:active{background:#dbeafe;transform:scale(.95)}
.pin-key.del{background:#fee2e2;color:#dc2626}
.login-err{color:#dc2626;font-size:.83rem;margin-top:8px;min-height:18px}
#app{min-height:100vh;display:flex;flex-direction:column}
.topbar{background:linear-gradient(90deg,#0f172a,#2563eb);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar-logo{font-weight:900;font-size:1.1rem}
.topbar-user{font-size:.75rem;opacity:.8;margin-top:2px}
.logout-btn{background:rgba(255,255,255,.15);border:none;color:#fff;padding:7px 13px;border-radius:8px;cursor:pointer;font-size:.82rem;font-weight:600}
.sync-indicator{font-size:.7rem;padding:3px 8px;border-radius:20px;font-weight:700;margin-left:8px}
.sync-ok{background:rgba(22,163,74,.3);color:#86efac}
.sync-err{background:rgba(220,38,38,.3);color:#fca5a5}
.sync-pending{background:rgba(245,158,11,.3);color:#fcd34d}
.pg-bar{background:#0f172a;padding:10px 16px;overflow-x:auto;display:flex;gap:8px;scrollbar-width:none}
.pg-bar::-webkit-scrollbar{display:none}
.pg-chip{padding:7px 14px;border-radius:20px;font-size:.8rem;font-weight:700;cursor:pointer;white-space:nowrap;border:2px solid transparent;color:rgba(255,255,255,.5)}
.pg-chip.active{color:#fff;border-color:currentColor}
.nav-tabs{display:flex;background:#1e3a5f;overflow-x:auto;scrollbar-width:none}
.nav-tabs::-webkit-scrollbar{display:none}
.nav-tab{padding:11px 16px;color:rgba(255,255,255,.6);font-size:.82rem;font-weight:600;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
.nav-tab.active{color:#fff;border-bottom-color:#f59e0b}
.content{flex:1;padding:16px;max-width:960px;margin:0 auto;width:100%}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card-title{font-size:.95rem;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:7px}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.stat-box{background:var(--card);border-radius:var(--radius);padding:14px;text-align:center;box-shadow:var(--shadow)}
.stat-num{font-size:1.8rem;font-weight:900}
.stat-label{font-size:.75rem;color:var(--sub);margin-top:2px}
.stat-box.green .stat-num{color:var(--green)}
.stat-box.red .stat-num{color:var(--red)}
.stat-box.blue .stat-num{color:var(--blue)}
.stat-box.gold .stat-num{color:var(--gold)}
.search-bar{width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:10px;font-size:.92rem;margin-bottom:12px;outline:none}
.search-bar:focus{border-color:#2563eb}
.student-row{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.student-row:last-child{border-bottom:none}
.student-name{font-weight:700;font-size:.95rem}
.att-btns{display:flex;gap:7px;margin-left:auto}
.att-btn{padding:10px 18px;border:none;border-radius:8px;font-weight:700;font-size:.82rem;cursor:pointer;opacity:.4}
.att-btn.active{opacity:1}
.att-btn.present{background:#dcfce7;color:var(--green)}
.att-btn.absent{background:#fee2e2;color:var(--red)}
.att-btn.present.active{background:var(--green);color:#fff}
.att-btn.absent.active{background:var(--red);color:#fff}
.notes-input{width:100%;padding:6px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:.8rem;margin-top:5px;outline:none}
.badge{font-size:.7rem;padding:2px 7px;border-radius:20px;font-weight:700;display:inline-block}
.badge.green{background:#dcfce7;color:var(--green)}
.badge.red{background:#fee2e2;color:var(--red)}
.badge.grey{background:#f1f5f9;color:var(--grey)}
.badge.blue{background:#eff6ff;color:#2563eb}
.form-row{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.form-label{font-size:.82rem;font-weight:700;color:var(--sub)}
.form-input,.form-select{padding:10px 12px;border:1.5px solid var(--border);border-radius:9px;font-size:.92rem;outline:none;width:100%}
.form-input:focus,.form-select:focus{border-color:#2563eb}
.btn{padding:11px 20px;border:none;border-radius:9px;font-weight:700;font-size:.88rem;cursor:pointer}
.btn-primary{background:#2563eb;color:#fff}
.btn-danger{background:#fee2e2;color:#dc2626}
.btn-success{background:#dcfce7;color:#16a34a}
.btn-gold{background:#fef3c7;color:#d97706}
.btn-sm{padding:6px 11px;font-size:.77rem}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.83rem}
th{background:#f1f5f9;padding:9px 11px;text-align:left;font-weight:700;color:var(--sub);white-space:nowrap}
td{padding:9px 11px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f8fafc}
.today-header{background:linear-gradient(135deg,#0f172a,#2563eb);color:#fff;border-radius:var(--radius);padding:16px;margin-bottom:14px}
.today-date{font-size:1.3rem;font-weight:900}
.today-sub{opacity:.75;font-size:.85rem;margin-top:2px}
.shift-slot-btn{padding:13px 10px;border:2px solid var(--border);border-radius:11px;background:#f8fafc;cursor:pointer;text-align:center;font-size:.85rem;width:100%}
.shift-slot-btn.selected{border-color:#2563eb;background:#eff6ff}
.pg-section-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:12px 14px;border-radius:10px;color:#fff;font-weight:800;font-size:1rem}
.week-day{border-radius:10px;padding:13px;border:2px solid var(--border);margin-bottom:8px}
.week-day.has-shift{border-color:#2563eb;background:#eff6ff}
.week-day.today-day{border-color:#f59e0b;background:#fffbeb}
.week-day-name{font-weight:800;font-size:.92rem}
.week-day-info{font-size:.82rem;color:var(--sub);margin-top:3px}
.progress-bar{height:7px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin-top:5px}
.progress-fill{height:100%;border-radius:99px}
.any-day-notice{background:#fffbeb;border:1.5px solid #f59e0b;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:.83rem;color:#92400e;font-weight:600}
.offline-banner{background:#dc2626;color:#fff;text-align:center;padding:8px;font-size:.82rem;font-weight:700}
@media(min-width:600px){.stat-grid{grid-template-columns:repeat(4,1fr)}.student-row{flex-wrap:nowrap}.att-btns{margin-left:auto;flex-shrink:0}}
</style>
</head>

// ─── FIREBASE SYNC ────────────────────────────────────────────────────────────
function setSyncStatus(state) {
  var el = document.getElementById('syncIndicator');
  if(!el) return;
  el.className = 'sync-indicator sync-' + state;
  el.textContent = state==='ok'?'● Live': state==='err'?'● Error':'● Saving…';
}

// Write a specific path to Firebase
function fbSet(path, value, cb) {
  if(!_useFirebase||!fbdb){localSave();if(cb)cb(null);return;}
  setSyncStatus('pending');
  fbdb.ref(path).set(value, function(err){
    setSyncStatus(err ? 'err' : 'ok');
    if(cb) cb(err);
  });
}
function fbUpdate(path, value, cb) {
  if(!_useFirebase||!fbdb){localSave();if(cb)cb(null);return;}
  setSyncStatus('pending');
  fbdb.ref(path).update(value, function(err){
    setSyncStatus(err ? 'err' : 'ok');
    if(cb) cb(err);
  });
}
function fbRemove(path, cb) {
  if(!_useFirebase||!fbdb){localSave();if(cb)cb(null);return;}
  setSyncStatus('pending');
  fbdb.ref(path).remove(function(err){
    setSyncStatus(err ? 'err' : 'ok');
    if(cb) cb(err);
  });
}
function localSave(){
  try{
    var snap={
      students:DB.students,attendance:DB.attendance,shifts:DB.shifts,
      personalSessions:DB.personalSessions,correctionLog:DB.correctionLog,
      coachPins:DB.coachPins,expenses:DB.expenses,
      payrollMonth:DB.payrollMonth,expenseMonth:DB.expenseMonth,
      payrollAddl:DB.payrollAddl||{}
    };
    localStorage.setItem('cfcParkourDB3',JSON.stringify(snap));
  }catch(e){}
}

// Firebase does not allow dots/slashes in keys
function safeKey(k) { return k.replace(/\./g,'_').replace(/\//g,'_').replace(/#/g,'_').replace(/\$/g,'_').replace(/\[/g,'_').replace(/\]/g,'_'); }
function unSafeKey(k) { return k; } // keys do not need reversing — we store original in value

// ─── LOAD FROM FIREBASE ───────────────────────────────────────────────────────
function loadFromFirebase(cb) {
  if(!_useFirebase||!fbdb){ loadFromLocalStorage(); cb(); return; }
  fbdb.ref('cfcParkour').once('value', function(snap) {
    var data = snap.val() || {};
    // Merge student active flags with master
    var flags = data.studentFlags || {};
    var sm = {};
    MASTER_STUDENTS.forEach(function(m){ sm[m.id] = m; });
    DB.students = MASTER_STUDENTS.map(function(m){
      var flag = flags[m.id];
      return Object.assign({}, m, {active: flag ? flag.active : true});
    });
    // Extra manually-added students stored separately
    if(data.extraStudents) {
      Object.values(data.extraStudents).forEach(function(s){ DB.students.push(s); });
    }
    // Restore attendance — keys were safeKeyed
    DB.attendance = {};
    if(data.attendance) {
      Object.keys(data.attendance).forEach(function(k){
        // Restore original key (replace _ back only for date separator)
        DB.attendance[k] = data.attendance[k];
      });
    }
    DB.shifts = data.shifts || [];
    // Firebase stores arrays as objects if there are gaps — normalise
    if(data.shifts && !Array.isArray(data.shifts)) {
      DB.shifts = Object.values(data.shifts);
    }
    DB.personalSessions = data.personalSessions || [];
    if(data.personalSessions && !Array.isArray(data.personalSessions)) {
      DB.personalSessions = Object.values(data.personalSessions);
    }
    DB.correctionLog = data.correctionLog || [];
    if(data.correctionLog && !Array.isArray(data.correctionLog)) {
      DB.correctionLog = Object.values(data.correctionLog);
    }
    DB.coachPins = data.coachPins || {};
    DB.expenses = data.expenses || {};
    DB.payrollMonth = data.payrollMonth || '';
    DB.expenseMonth = data.expenseMonth || '';
    loadZohoConfig(data);
    _fbLoaded = true;
    cb();
  }, function(err) {
    // Firebase read failed — try localStorage fallback
    console.warn('Firebase read failed, using localStorage fallback', err);
    loadFromLocalStorage();
    _fbLoaded = true;
    cb();
  });
}

function loadFromLocalStorage() {
  try {
    var s = localStorage.getItem('cfcParkourDB3');
    if(s) {
      var p = JSON.parse(s);
      var sm = {};
      (p.students||[]).forEach(function(x){ sm[x.id]=x; });
      DB.students = MASTER_STUDENTS.map(function(m){ return sm[m.id]?Object.assign({},m,{active:sm[m.id].active}):m; });
      var mids={};
      MASTER_STUDENTS.forEach(function(x){mids[x.id]=true;});
      (p.students||[]).filter(function(x){return !mids[x.id];}).forEach(function(x){DB.students.push(x);});
      DB.attendance=p.attendance||{};
      DB.shifts=p.shifts||[];
      DB.personalSessions=p.personalSessions||[];
      DB.correctionLog=p.correctionLog||[];
      DB.coachPins=p.coachPins||{};
      DB.expenses=p.expenses||{};
      DB.payrollMonth=p.payrollMonth||'';
      DB.expenseMonth=p.expenseMonth||'';
    } else {
      DB.students = MASTER_STUDENTS.slice();
    }
  } catch(e) { DB.students = MASTER_STUDENTS.slice(); }
}

// Real-time listener — updates DB.attendance live when other coaches mark attendance
function startRealtimeListeners() {
  if(!_useFirebase||!fbdb){ setSyncStatus('ok'); return; }
  fbdb.ref('cfcParkour/attendance').on('value', function(snap){
    DB.attendance = snap.val() || {};
  });
  fbdb.ref('cfcParkour/payrollAddl').on('value', function(snap){
    var v = snap.val();
    DB.payrollAddl = v||{};
    if(currentUser && currentUser.role==='admin' && currentTab==='payroll') renderPayroll();
  });

  fbdb.ref('cfcParkour/shifts').on('value', function(snap){
    var v = snap.val();
    if(v){
      // Handle both object and array formats
      var arr = Array.isArray(v) ? v : Object.values(v);
      DB.shifts = arr.filter(function(s){ return s && s.id; });
    } else {
      DB.shifts = [];
    }
    console.log('Firebase shifts updated:', DB.shifts.length, 'shifts:', JSON.stringify(DB.shifts).substring(0,200));
    // If coach portal is active, refresh it so new releases appear immediately
    if(currentUser && currentUser.role==='coach' && currentTab==='coachPortal'){
      renderCoachPortal();
    }
    // If admin is on special shifts, refresh the list too
    if(currentUser && currentUser.role==='admin' && currentTab==='schedule'){
      var el = document.getElementById('adminSessionList');
      if(el){ el.innerHTML = buildAdminSessionList('all'); wireDeleteBtns(); }
    }
  });
  fbdb.ref('cfcParkour/coachPins').on('value', function(snap){
    DB.coachPins = snap.val() || {};
  });
  fbdb.ref('.info/connected').on('value', function(snap){
    var online = snap.val() === true;
    var banner = document.getElementById('offlineBanner');
    if(banner) banner.classList.toggle('hidden', online);
    setSyncStatus(online ? 'ok' : 'err');
  });
}

function todayDate(){ return new Date().toISOString().split('T')[0]; }
function todayDay(){ return new Date().toLocaleDateString('en-US',{weekday:'long'}); }
function todayFull(){ return new Date().toLocaleDateString('en-ZA',{weekday:'long',year:'numeric',month:'long',day:'numeric'}); }
function tsNow(){ return new Date().toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit'}); }
function attKey(d,sid){ return safeKey(d+'_'+sid); }
function uid(){ return 'id_'+Date.now()+'_'+Math.random().toString(36).slice(2,7); }
function getPG(id){ return PLAYGROUPS.filter(function(p){return p.id===id;})[0]; }
function isAnyDay(pgId){ return ANY_DAY_GROUPS.indexOf(pgId)>=0; }
function coachName(k){ if(!k) return 'Unclaimed'; return COACHES[k]?COACHES[k].name:(USERS[k]?USERS[k].name:k); }
function fullName(s){ return (s.first+' '+s.last).trim(); }
function getDaysForPG(pgId){ return PG_DAYS[pgId]||['Monday','Tuesday','Wednesday','Thursday','Friday']; }
function h(str){ return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function classifierOptions(pgId){
  if(pgId==='aisj') return ['KG','Grade 1','Grade 2','Grade 3','Grade 4','Grade 6'];
  if(pgId==='ninjas') return ['10 yrs','11 yrs','12 yrs','13 yrs','14 yrs','15 yrs'];
  if(pgId==='apex') return ['16+'];
  if(pgId==='lninjas') return ['5 yrs','6 yrs','7 yrs','8 yrs','9 yrs','10 yrs'];
  return ['3-4 yrs','5-6 yrs','7-8 yrs','9-10 yrs','11-12 yrs','13-17 yrs','18+'];
}
function getStudentsForSession(pgId, date) {
  var students = DB.students.filter(function(s){ return s.active && s.playgroup===pgId; });
  if(isAnyDay(pgId)) return students;
  var dayName = new Date(date+'T12:00:00').toLocaleDateString('en-US',{weekday:'long'});
  return students.filter(function(s){ return s.day===dayName; });
}

      +'<div class="att-btns">'
      +'<button class="att-btn present'+(a.status==='present'?' active':'')+'" onclick="markAtt(\''+s.id+'\',\''+date+'\',\'present\')" id="bp_'+s.id+'">✓ Present</button>'
      +'<button class="att-btn absent'+(a.status==='absent'?' active':'')+'" onclick="markAtt(\''+s.id+'\',\''+date+'\',\'absent\')" id="ba_'+s.id+'">✗ Absent</button>'
      +'</div></div>';
  }).join('');
}
function markAtt(sid,date,status){
  var key=attKey(date,sid);
  var ex=DB.attendance[key]||{};
  var record=Object.assign({},ex,{status:status,timestamp:tsNow(),coach:currentUser.name});
  DB.attendance[key]=record;
  saveAttendance(key,record);
  var bp=document.getElementById('bp_'+sid); if(bp){bp.classList.toggle('active',status==='present');}
  var ba=document.getElementById('ba_'+sid); if(ba){ba.classList.toggle('active',status==='absent');}
  var ts=document.getElementById('ts_'+sid); if(ts) ts.textContent='✓ '+tsNow()+' · '+currentUser.name;
}
function updateNotes(sid,date,notes){
  var key=attKey(date,sid);
  var ex=DB.attendance[key]||{};
  var record=Object.assign({},ex,{notes:notes});
  DB.attendance[key]=record;
  saveAttendance(key,record);
}

function corrSearchStudent(q){
  var list=document.getElementById('corrStudentList');
  if(!q||q.length<2){list.innerHTML='';return;}
  var matches=DB.students.filter(function(s){return s.active&&fullName(s).toLowerCase().indexOf(q.toLowerCase())>=0;}).slice(0,8);
  list.innerHTML=matches.map(function(s){
    var pg=getPG(s.playgroup);
    return '<button onclick="selectCorrStudent(\''+s.id+'\')" style="display:block;width:100%;text-align:left;padding:9px 12px;margin-bottom:4px;border:1.5px solid var(--border);border-radius:8px;background:#f8fafc;cursor:pointer;font-size:.9rem">'
      +'<strong>'+h(fullName(s))+'</strong> <span style="color:var(--sub);font-size:.78rem">'+(pg?pg.emoji+' '+pg.label:'')+' · '+(s.day==='any'?'any day':s.day)+'</span></button>';
  }).join('');
}
var _corrStudentId=null;
function selectCorrStudent(sid){
  _corrStudentId=sid;
  var s=DB.students.filter(function(x){return x.id===sid;})[0];
  var date=document.getElementById('corrDate').value;
  var a=DB.attendance[attKey(date,sid)]||{};
  document.getElementById('corrStudentList').innerHTML='';
  document.getElementById('corrSearch').value=fullName(s);
  document.getElementById('corrPanel').classList.remove('hidden');
  document.getElementById('corrStudentName').textContent=fullName(s);
  document.getElementById('corrDateLabel').textContent=date;
  document.getElementById('corrCurrentStatus').innerHTML=a.status
    ?'Status: <strong style="color:'+(a.status==='present'?'var(--green)':'var(--red)')+'">'+( a.status==='present'?'✓ Present':'✗ Absent')+'</strong> · Logged '+(a.timestamp||'?')+' by '+(a.coach||'?')
    :'<span style="color:var(--sub)">No attendance marked for this date</span>';
  document.getElementById('corrStatus').value=a.status||'present';
}
function applyCorrection(){
  if(!_corrStudentId){alert('Select a student first.');return;}
  var date=document.getElementById('corrDate').value;
  var status=document.getElementById('corrStatus').value;
  var reason=document.getElementById('corrReason').value.trim()||'Admin correction';
  var key=attKey(date,_corrStudentId);
  if(status==='clear'){
    delete DB.attendance[key];
    saveAttendance(key,null);
  } else {
    var record={status:status,timestamp:tsNow(),coach:'Amanda (Override)',notes:reason};
    DB.attendance[key]=record;
    saveAttendance(key,record);
  }
  if(!DB.correctionLog) DB.correctionLog=[];
  var s=DB.students.filter(function(x){return x.id===_corrStudentId;})[0];
  DB.correctionLog.unshift({id:uid(),student:fullName(s),date:date,status:status,reason:reason,at:tsNow()});
  saveCorrectionLog();
  alert('Correction applied for '+fullName(s)); _corrStudentId=null; renderCorrections();
}
function renderCorrLog(){
  var log=DB.correctionLog||[];
  if(!log.length) return '<div style="color:var(--sub);font-size:.85rem">No corrections yet.</div>';
  var html='<div class="table-wrap"><table><tr><th>Date</th><th>Student</th><th>Changed To</th><th>Reason</th><th>Time</th></tr>';
  log.slice(0,20).forEach(function(c){
    var cls=c.status==='present'?'green':c.status==='absent'?'red':'grey';
    html+='<tr><td>'+c.date+'</td><td><strong>'+h(c.student)+'</strong></td><td><span class="badge '+cls+'">'+(c.status==='clear'?'Cleared':c.status)+'</span></td><td style="font-size:.8rem;color:var(--sub)">'+h(c.reason)+'</td><td style="font-size:.78rem">'+c.at+'</td></tr>';
  });
  return html+'</table></div>';
}

function saveZohoCredentials(){
  var orgId=document.getElementById('zohoOrgId').value.trim();
  var clientId=document.getElementById('zohoClientId').value.trim();
  var clientSecret=document.getElementById('zohoClientSecret').value.trim();

  DB.zohoClientSecret=clientSecret;
  fbSet('cfcParkour/zohoOrgId',orgId);
  fbSet('cfcParkour/zohoClientId',clientId);
  fbSet('cfcParkour/zohoClientSecret',clientSecret);
  alert('✅ Credentials saved! Now click Connect to Zoho Books.');
}

function openZohoAuth(){
  var clientId=DB.zohoClientId;
  if(!clientId){alert('Save your credentials first.');return;}
  var redirect=encodeURIComponent('https://megan471.github.io/cfc-parkour/');
  var scope=encodeURIComponent('ZohoBooks.invoices.READ ZohoBooks.contacts.READ');
  var url='https://accounts.zoho.com/oauth/v2/auth?scope='+scope+'&client_id='+clientId+'&response_type=code&redirect_uri='+redirect+'&access_type=offline';
  window.open(url,'_blank');
  alert('After approving access in Zoho, copy the "code" from the redirect URL and paste it here.');
  var code=prompt('Paste the authorisation code from the redirect URL:');
  if(code) exchangeZohoCode(code);
}

function exchangeZohoCode(code){
  // NOTE: Token exchange requires a server-side call (CORS restriction)
  // Store the code and show manual instructions
  DB.zohoAuthCode=code;
  fbSet('cfcParkour/zohoAuthCode',code);
  mc_show_zoho_instructions(code);
}

function mc_show_zoho_instructions(code){

function saveZohoTokens(){

  var refresh=document.getElementById('zohoRefreshToken').value.trim();
  if(!access||!refresh){alert('Please paste both tokens.');return;}
  DB.zohoToken={access_token:access,refresh_token:refresh};
  fbSet('cfcParkour/zohoToken',DB.zohoToken);
  alert('✅ Connected to Zoho Books!');
  renderInvoicing();
}

function disconnectZoho(){
  if(!confirm('Disconnect Zoho Books?')) return;
  DB.zohoToken=null;
  fbSet('cfcParkour/zohoToken',null);
  renderInvoicing();
}

function fetchZohoInvoices(){
  var el=document.getElementById('zohoInvoiceContent');
  if(!el) return;
  if(!DB.zohoToken||!DB.zohoOrgId){el.innerHTML='<div style="color:var(--red);">Not connected.</div>';return;}
  el.innerHTML='<div style="text-align:center;padding:24px;color:var(--sub);">⏳ Fetching invoices from Zoho Books...</div>';

  fetch('https://www.zohoapis.com/books/v3/invoices?organization_id='+DB.zohoOrgId+'&per_page=200',{
    headers:{'Authorization':'Zoho-oauthtoken '+DB.zohoToken.access_token}
  })
  .then(function(r){ return r.json(); })
  .then(function(data){
    if(data.code===57 || data.code===401){
      el.innerHTML='<div style="color:var(--red);padding:16px;">Token expired. Please reconnect Zoho Books.</div>'
        +'<button class="btn btn-primary" onclick="disconnectZoho()">Reconnect</button>';
      return;
    }
    var invoices=data.invoices||[];
    renderZohoInvoices(invoices, el);
  })
  .catch(function(e){
    el.innerHTML='<div style="color:var(--red);padding:16px;">❌ Error fetching invoices: '+e.message+'<br/><br/>'
      +'<b>If you see a CORS error</b> — Zoho API requires requests from a server, not directly from the browser. '
      +'Consider using a proxy or the Zoho Books mobile app for now.</div>';
  });
}

function renderZohoInvoices(invoices, el){
  var paid=invoices.filter(function(i){return i.status==='paid';});
  var overdue=invoices.filter(function(i){return i.status==='overdue';});
  var sent=invoices.filter(function(i){return i.status==='sent';});
  var draft=invoices.filter(function(i){return i.status==='draft';});

  var html='<div class="stat-grid" style="margin-bottom:14px;">'
    +'<div class="stat-box green"><div class="stat-num">'+paid.length+'</div><div class="stat-label">Paid</div></div>'
    +'<div class="stat-box red"><div class="stat-num">'+overdue.length+'</div><div class="stat-label">Overdue</div></div>'
    +'<div class="stat-box gold"><div class="stat-num">'+sent.length+'</div><div class="stat-label">Sent / Awaiting</div></div>'
    +'<div class="stat-box"><div class="stat-num" style="color:#94a3b8;">'+draft.length+'</div><div class="stat-label">Draft</div></div>'
    +'</div>';

  var groups=[
    {label:'🔴 Overdue — Action Required',list:overdue,color:'#dc2626',bg:'#fee2e2'},
    {label:'🟡 Sent — Awaiting Payment',list:sent,color:'#d97706',bg:'#fef3c7'},
    {label:'⚪ Draft — Not Yet Sent',list:draft,color:'#64748b',bg:'#f1f5f9'},
    {label:'💚 Paid',list:paid,color:'#16a34a',bg:'#dcfce7'},
  ];

  groups.forEach(function(g){
    if(!g.list.length) return;
    html+='<div style="margin-bottom:14px;">'
      +'<div style="font-weight:700;font-size:.88rem;margin-bottom:8px;padding:8px 12px;background:'+g.bg+';border-radius:8px;color:'+g.color+';">'+g.label+' ('+g.list.length+')</div>'
      +'<div class="table-wrap"><table><tr><th>Invoice #</th><th>Customer</th><th>Date</th><th>Due</th><th>Amount</th><th>Status</th></tr>';
    g.list.forEach(function(inv){
      var statusCol=inv.status==='paid'?'#16a34a':inv.status==='overdue'?'#dc2626':inv.status==='sent'?'#d97706':'#64748b';
      html+='<tr>'
        +'<td style="font-family:monospace;font-size:.82rem;">'+inv.invoice_number+'</td>'
        +'<td><strong>'+h(inv.customer_name)+'</strong></td>'
        +'<td>'+inv.date+'</td>'
        +'<td>'+inv.due_date+'</td>'
        +'<td style="font-weight:700;">R '+parseFloat(inv.total).toLocaleString('en-ZA',{minimumFractionDigits:2})+'</td>'
        +'<td><span style="background:'+statusCol+'22;color:'+statusCol+';padding:2px 8px;border-radius:20px;font-weight:700;font-size:.75rem;">'+inv.status+'</span></td>'
        +'</tr>';
    });
    html+='</table></div></div>';
  });

  el.innerHTML=html;
}

function saveZohoCredentials(){
  var orgId=document.getElementById('zOrgId').value.trim();
  var clientId=document.getElementById('zClientId').value.trim();
  var clientSecret=document.getElementById('zClientSecret').value.trim();
  if(!orgId||!clientId||!clientSecret){alert('Please fill in all three fields.');return;}
  DB.zohoCfg=Object.assign(DB.zohoCfg||{},{orgId:orgId,clientId:clientId,clientSecret:clientSecret});
  saveDB();
  document.getElementById('zohoAuthUrlRow').style.display='block';
  buildZohoAuthUrl();
  document.getElementById('zohoStatus').innerHTML='<span style="color:#16a34a;font-weight:600;">✅ Credentials saved. Now open the authorisation URL above.</span>';
}

function buildZohoAuthUrl(){
  var cfg=DB.zohoCfg||{};
  var redirect=encodeURIComponent('https://megan471.github.io/cfc-parkour/');
  var url='https://accounts.zoho.com/oauth/v2/auth?scope=ZohoBooks.invoices.READ,ZohoBooks.contacts.READ'
    +'&client_id='+encodeURIComponent(cfg.clientId||'')
    +'&response_type=code&access_type=offline'
    +'&redirect_uri='+redirect;
  var el=document.getElementById('zohoAuthUrl');
  var lnk=document.getElementById('zohoAuthLink');
  if(el) el.textContent=url;
  if(lnk){ lnk.href=url; }
}

function exchangeZohoToken(){
  var code=(document.getElementById('zAuthCode').value||'').trim().replace(/^code=/,'');
  var cfg=DB.zohoCfg||{};
  if(!code){alert('Paste the auth code first.');return;}
  var statusEl=document.getElementById('zohoStatus');
  statusEl.innerHTML='<span style="color:#2563eb;">⏳ Exchanging token... (this needs a backend call due to CORS — see instructions)</span>';
  // Zoho token exchange cannot be done from browser due to CORS
  // Show manual curl command instead
  var redirect='https://megan471.github.io/cfc-parkour/';
  var curlCmd='curl -X POST https://accounts.zoho.com/oauth/v2/token \
'
    +' -d "code='+code+'&client_id='+cfg.clientId+'&client_secret='+cfg.clientSecret
    +'&redirect_uri='+redirect+'&grant_type=authorization_code"';
  statusEl.innerHTML='<div style="background:#0f172a;color:#86efac;border-radius:8px;padding:12px;font-family:monospace;font-size:.75rem;white-space:pre-wrap;margin-bottom:10px;">'+curlCmd+'</div>'
    +'<div style="font-size:.83rem;color:#78350f;background:#fef3c7;padding:10px;border-radius:8px;margin-bottom:10px;">'
    +'Run the command above in Terminal. Copy the <strong>access_token</strong> and <strong>refresh_token</strong> from the response, then paste them below.</div>'
    +'<div class="form-row"><label class="form-label">Access Token</label>'
    +'<input type="text" class="form-input" id="zAccessToken" placeholder="Paste access_token here"></div>'
    +'<div class="form-row"><label class="form-label">Refresh Token</label>'
    +'<input type="text" class="form-input" id="zRefreshToken" placeholder="Paste refresh_token here"></div>'
    +'<button class="btn" style="background:#059669;color:#fff;width:100%;" onclick="saveZohoTokens()">✅ Connect to Zoho Books</button>';
}

function saveZohoTokens(){
  var at=(document.getElementById('zAccessToken')||{}).value||'';
  var rt=(document.getElementById('zRefreshToken')||{}).value||'';
  if(!at||!rt){alert('Paste both tokens.');return;}
  DB.zohoCfg=Object.assign(DB.zohoCfg||{},{accessToken:at,refreshToken:rt});
  saveDB();
  alert('✅ Connected! Loading your invoices...');
  renderInvoicing();
}

function disconnectZoho(){
  if(!confirm('Disconnect Zoho Books?')) return;
  DB.zohoCfg={};
  saveDB();
  renderInvoicing();
}

function loadZohoInvoices(){
  var cfg=DB.zohoCfg||{};
  var dash=document.getElementById('invoiceDash');
  if(!dash) return;
  // Fetch invoices from Zoho Books API
  fetch('https://www.zohoapis.com/books/v3/invoices?organization_id='+cfg.orgId+'&status=all&per_page=100',{
    headers:{'Authorization':'Zoho-oauthtoken '+cfg.accessToken}
  })
  .then(function(r){
    if(r.status===401){
      dash.innerHTML='<div style="color:#dc2626;padding:14px;">⚠️ Token expired. Please reconnect Zoho Books.</div>'
        +'<button class="btn btn-primary" onclick="disconnectZoho()">Reconnect</button>';
      return null;
    }
    return r.json();
  })
  .then(function(data){
    if(!data) return;
    if(data.code!==0){
      dash.innerHTML='<div style="color:#dc2626;padding:14px;">Zoho API error: '+(data.message||JSON.stringify(data))+'</div>';
      return;
    }
    renderInvoiceDash(data.invoices||[]);
  })
  .catch(function(e){
    if(dash) dash.innerHTML='<div style="color:#dc2626;padding:14px;">⚠️ Could not reach Zoho API. Check your token and connection.<br><small>'+e.message+'</small></div>';
  });
}

function renderInvoiceDash(invoices){
  var dash=document.getElementById('invoiceDash');
  if(!dash) return;
  window._zohoInvoices=invoices;
  var paid=invoices.filter(function(i){return i.status==='paid';}).length;
  var overdue=invoices.filter(function(i){return i.status==='overdue';}).length;
  var sent=invoices.filter(function(i){return i.status==='sent';}).length;
  var draft=invoices.filter(function(i){return i.status==='draft';}).length;
  var html='<div class="stat-grid" style="margin-bottom:16px;">'
    +'<div class="stat-box green"><div class="stat-num">'+paid+'</div><div class="stat-label">Paid</div></div>'
    +'<div class="stat-box"><div class="stat-num" style="color:#dc2626;">'+overdue+'</div><div class="stat-label">Overdue</div></div>'
    +'<div class="stat-box blue"><div class="stat-num">'+sent+'</div><div class="stat-label">Sent</div></div>'
    +'<div class="stat-box gold"><div class="stat-num">'+draft+'</div><div class="stat-label">Draft</div></div>'
    +'</div>'
    +'<div id="invoiceFilters" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;">'
    +'<button class="btn btn-sm inv-filter" data-f="all">All ('+invoices.length+')</button>'
    +'<button class="btn btn-sm inv-filter" data-f="paid" style="background:#dcfce7;color:#16a34a;">✅ Paid</button>'
    +'<button class="btn btn-sm inv-filter" data-f="overdue" style="background:#fee2e2;color:#dc2626;">⚠️ Overdue</button>'
    +'<button class="btn btn-sm inv-filter" data-f="sent" style="background:#dbeafe;color:#2563eb;">📨 Sent</button>'
    +'<button class="btn btn-sm inv-filter" data-f="draft" style="background:#fef3c7;color:#d97706;">📝 Draft</button>'
    +'</div>'
    +'<div id="invoiceTable">'+buildInvoiceTable(invoices)+'</div>';
  dash.innerHTML=html;
  // Attach filter button listeners
  document.querySelectorAll('.inv-filter').forEach(function(btn){
    btn.addEventListener('click',function(){filterInvoices(this.getAttribute('data-f'));});
  });

function buildInvoiceTable(invoices){
  if(!invoices.length) return '<div style="color:var(--sub);padding:14px;">No invoices found.</div>';
  var statusColors={paid:'#16a34a',overdue:'#dc2626',sent:'#2563eb',draft:'#d97706',void:'#64748b'};
  var html='<div class="table-wrap"><table>'
    +'<tr><th>Invoice #</th><th>Customer</th><th>Date</th><th>Due</th><th>Amount</th><th>Status</th></tr>';
  invoices.forEach(function(inv){
    var col=statusColors[inv.status]||'#64748b';
    html+='<tr>'
      +'<td style="font-weight:600;color:#2563eb;">'+inv.invoice_number+'</td>'
      +'<td>'+inv.customer_name+'</td>'
      +'<td>'+inv.date+'</td>'
      +'<td style="color:'+(inv.status==='overdue'?'#dc2626':'inherit')+';">'+inv.due_date+'</td>'
      +'<td style="font-weight:700;">'+inv.currency_symbol+(parseFloat(inv.total)||0).toFixed(2)+'</td>'
      +'<td><span style="background:'+col+'22;color:'+col+';padding:2px 8px;border-radius:20px;font-size:.75rem;font-weight:700;text-transform:uppercase;">'+inv.status+'</span></td>'
      +'</tr>';
  });
  html+='</table></div>';
  return html;
}

function filterInvoices(status){
  var all=window._zohoInvoices||[];
  var filtered=status==='all'?all:all.filter(function(i){return i.status===status;});
  var el=document.getElementById('invoiceTable');
  if(el) el.innerHTML=buildInvoiceTable(filtered);
}

              +'<div style="font-size:.78rem;color:var(--sub);">'+s.start+'–'+s.end+'</div>'
              +'</button>';
          }).join('') || '<div style="color:var(--sub);font-size:.85rem;">No fixed slots — use Custom One-Off Shift below.</div>';
          document.getElementById('slotBtns').innerHTML = btnsHtml;
          document.getElementById('slotPickerArea').style.display='block';
          document.getElementById('dateRow').style.display='none';
          document.getElementById('releaseSlotBtn').style.display='none';

          // Wire slot buttons
          document.querySelectorAll('.slot-btn').forEach(function(sb){
            sb.addEventListener('click', function(){
              document.querySelectorAll('.slot-btn').forEach(function(b){b.style.background='var(--card)';b.style.borderColor='var(--border)';});
              this.style.background = pg?pg.color+'33':'#2563eb22';
              this.style.borderColor = pg?pg.color:'#2563eb';
              window._adminSlot = {
                day: this.getAttribute('data-day'),
                start: this.getAttribute('data-start'),
                end: this.getAttribute('data-end')
              };
              document.getElementById('dateRow').style.display='block';
              document.getElementById('releaseSlotBtn').style.display='block';
            });
          });
        }
      });
    });

    // Wire release button
    document.getElementById('releaseSlotBtn').addEventListener('click', function(){
      var pg = window._adminPG;
      var slot = window._adminSlot;
      var date = document.getElementById('shDate').value;
      if(!pg){alert('Select a playgroup first.');return;}
      if(!slot){alert('Select a time slot first.');return;}
      if(!date){alert('Please pick a date.');return;}
      var newShift = {
        id: uid(),
        coach: slot.personalCoach || null,
        playgroup: pg,
        day: slot.day,
        date: date,
        startTime: slot.start,
        endTime: slot.end,
        special: true
      };
      if(slot.description) newShift.description = slot.description;
      DB.shifts = DB.shifts||[];
      DB.shifts.push(newShift);
      saveShifts();
      document.getElementById('adminSessionList').innerHTML = buildAdminSessionList('all');
      wireDeleteBtns();
      // Reset
      window._adminSlot = null;
      document.querySelectorAll('.slot-btn').forEach(function(b){b.style.background='var(--card)';b.style.borderColor='var(--border)';});
      document.getElementById('releaseSlotBtn').style.display='none';
      document.getElementById('dateRow').style.display='none';
      alert('✅ Shift released! Coaches can now claim it.');
    });

    // Wire custom shift
    document.getElementById('addCustomBtn').addEventListener('click', function(){
      var pgId=document.getElementById('customPG').value;
      var day=document.getElementById('customDay').value;
      var st=document.getElementById('customStart').value;
      var et=document.getElementById('customEnd').value;
      var dt=document.getElementById('customDate').value;
      if(!pgId||!day||!st||!et||!dt){alert('Please fill in all fields.');return;}
      DB.shifts=DB.shifts||[];
      DB.shifts.push({id:uid(),coach:null,playgroup:pgId,day:day,date:dt,startTime:st,endTime:et,special:true});
      saveShifts();
      document.getElementById('adminSessionList').innerHTML=buildAdminSessionList('all');
      wireDeleteBtns();
      alert('✅ Custom shift added!');
    });

    // Wire clear all
    document.getElementById('clearAllShiftsBtn').addEventListener('click', function(){
      if(!confirm('Clear ALL released shifts?')) return;
      DB.shifts=[];
      saveShifts();
      document.getElementById('adminSessionList').innerHTML=buildAdminSessionList('all');
      alert('✅ All shifts cleared.');
    });

    // Wire filter buttons
    document.querySelectorAll('.asf-btn').forEach(function(btn){
      btn.addEventListener('click',function(){filterAdminSessions(this.getAttribute('data-asf'));});
    });

    // Wire delete buttons
    wireDeleteBtns();

  } catch(err){
    mc.innerHTML='<div class="card"><div style="color:#dc2626;padding:14px;">Error: '+err.message+'</div></div>';
    console.error(err);
  }
}



function buildAdminSessionList(filter){
  // Only show shifts that Amanda has explicitly released (in DB.shifts)
  var shifts = (DB.shifts||[]).slice();

  // Apply filter
  if(filter==='claimed')   shifts = shifts.filter(function(s){return !!s.coach;});
  else if(filter==='unclaimed') shifts = shifts.filter(function(s){return !s.coach;});
  else if(filter&&filter!=='all') shifts = shifts.filter(function(s){return s.playgroup===filter;});

  // Sort by date
  shifts.sort(function(a,b){return (a.date||'').localeCompare(b.date||'');});

  if(!shifts.length) return '<div style="color:var(--sub);padding:14px 0;font-size:.85rem;">No shifts released yet for this filter.</div>';

  var html = '<div class="table-wrap"><table>'
    + '<tr><th>Status</th><th>Group</th><th>Date</th><th>Day</th><th>Time</th><th style="width:60px;"></th></tr>';

  shifts.forEach(function(s){
    var pg = getPG(s.playgroup);
    var cl = s.coach ? COACHES[s.coach] : null;
    var cl = s.coach ? COACHES[s.coach] : null;
    var rateLabel = (s.eventRate !== undefined) ? ' · R'+s.eventRate : '';
    var badge = cl
      ? '<span style="background:'+cl.color+'22;color:'+cl.color+';padding:2px 8px;border-radius:20px;font-size:.72rem;font-weight:700;">✓ '+cl.name+rateLabel+'</span>'
      : '<span style="background:#fef3c7;color:#d97706;padding:2px 8px;border-radius:20px;font-size:.72rem;font-weight:700;">⏳ Unclaimed</span>';

    var pgLabel = pg ? pg.emoji+' '+pg.label : s.playgroup;
    if(s.description) pgLabel += ' <span style="font-size:.72rem;color:#db2777;font-weight:600;">— '+s.description+'</span>';
    html += '<tr>'
      + '<td>'+badge+'</td>'
      + '<td>'+pgLabel+'</td>'
      + '<td>'+(s.date||'—')+'</td>'
      + '<td>'+s.day+'</td>'
      + '<td style="font-weight:600;color:#2563eb;">'+(s.startTime||'')+'–'+(s.endTime||'')+'</td>'
      + '<td><button class="btn btn-danger btn-sm del-shift-btn" data-did="'+s.id+'" title="Delete shift">🗑</button></td>'
      + '</tr>';
  });

  html += '</table></div>';
  return html;
}


function wireDeleteBtns(){
  document.querySelectorAll('.del-shift-btn').forEach(function(b){
    b.addEventListener('click', function(){
      var did = this.getAttribute('data-did');
      if(!confirm('Delete this shift?')) return;
      DB.shifts = (DB.shifts||[]).filter(function(s){ return s.id !== did; });
      saveShifts();
      document.getElementById('adminSessionList').innerHTML = buildAdminSessionList('all');
      wireDeleteBtns();
    });
  });
}

function filterAdminSessions(f){
  var el=document.getElementById('adminSessionList');
  if(el){ el.innerHTML=buildAdminSessionList(f); wireDeleteBtns(); }
}


function addShift(){
  var pgId=document.getElementById('shPG').value;

  var end=document.getElementById('shEnd').value;

function renderShiftList(filter){
  var shifts=DB.shifts;
  if(filter==='claimed') shifts=DB.shifts.filter(function(s){return !!s.coach;});
  else if(filter==='unclaimed') shifts=DB.shifts.filter(function(s){return !s.coach;});
  else if(filter&&filter!=='all') shifts=DB.shifts.filter(function(s){return s.playgroup===filter;});
  if(!shifts.length) return '<div style="color:var(--sub);font-size:.85rem">No shifts yet.</div>';
  shifts=shifts.slice().sort(function(a,b){if(a.date&&b.date)return b.date.localeCompare(a.date);return 0;});
  var html='<div class="table-wrap"><table><tr><th>Coach</th><th>Playgroup</th><th>Day</th><th>Time</th><th>Date</th><th></th></tr>';
  shifts.forEach(function(s){

function filterStudents(q){
  var anyDay=isAnyDay(currentPG);

    DB.students.filter(function(s){return s.playgroup===currentPG&&fullName(s).toLowerCase().indexOf(q.toLowerCase())>=0;}),anyDay);

function renderStudentTable(students,anyDay){
  if(!students.length) return '<div style="color:var(--sub);padding:14px 0">No students yet.</div>';
  if(anyDay){
    return students.map(function(s){
      return '<div class="student-row" style="'+(s.active?'':'opacity:.4')+'">'
        +'<div style="flex:1"><div class="student-name">'+h(fullName(s))+(s.active?'':' <span style="font-size:.7rem;color:var(--red)">(Inactive)</span>')+'</div>'
        +'<div style="display:flex;gap:5px;margin-top:3px"><span class="badge blue">'+h(s.classifier)+'</span><span class="badge grey">Any Day</span></div></div>'
        +'<div style="display:flex;gap:6px">'
        +'<button class="btn btn-sm '+(s.active?'btn-danger':'btn-success')+'" onclick="toggleStudent(\''+s.id+'\')">'+(s.active?'Deactivate':'Activate')+'</button>'
        +'<button class="btn btn-danger btn-sm" onclick="deleteStudent(\''+s.id+'\')">🗑</button></div></div>';
    }).join('');
  }
  var days=getDaysForPG(currentPG); var seen={}; var unique=students.filter(function(s){if(seen[s.id])return false;seen[s.id]=true;return true;});
  return days.map(function(day){
    var ds=unique.filter(function(s){return s.day===day;});
    if(!ds.length) return '';
    var html='<div style="margin-bottom:16px"><div style="font-weight:800;color:#2563eb;font-size:.87rem;margin-bottom:7px;padding:5px 0;border-bottom:2px solid #dbeafe">'+day+' - '+ds.filter(function(s){return s.active;}).length+' students</div>';
    ds.forEach(function(s){
      html+='<div class="student-row" style="'+(s.active?'':'opacity:.4')+'">'
        +'<div style="flex:1"><div class="student-name">'+h(fullName(s))+(s.active?'':' <span style="font-size:.7rem;color:var(--red)">(Inactive)</span>')+'</div>'
        +'<div style="display:flex;gap:5px;margin-top:3px"><span class="badge blue">'+h(s.classifier)+'</span></div></div>'
        +'<div style="display:flex;gap:6px">'
        +'<button class="btn btn-sm '+(s.active?'btn-danger':'btn-success')+'" onclick="toggleStudent(\''+s.id+'\')">'+(s.active?'Deactivate':'Activate')+'</button>'
        +'<button class="btn btn-danger btn-sm" onclick="deleteStudent(\''+s.id+'\')">🗑</button></div></div>';
    });
    return html+'</div>';
  }).join('');
}
function addStudent(){
  var first=document.getElementById('stFirst').value.trim(); var last=document.getElementById('stLast').value.trim();
  var classifier=document.getElementById('stClass').value; var anyDay=isAnyDay(currentPG);
  var day=anyDay?'any':(document.getElementById('stDay')?document.getElementById('stDay').value:'any');
  if(!first){alert('Please enter a first name.');return;}
  var ns={id:uid(),first:first,last:last,playgroup:currentPG,classifier:classifier,day:day,active:true};
  DB.students.push(ns);
  // Save extra student to Firebase
  fbSet('cfcParkour/extraStudents/'+ns.id, ns);
  renderStudents();
}
function toggleStudent(id){
  var s=DB.students.filter(function(x){return x.id===id;})[0];
  if(s){s.active=!s.active; saveStudentFlags(); if(currentPG==='personal')renderPersonalClients();else renderStudents();}
}
function deleteStudent(id){
  if(!confirm('Permanently delete?')) return;
  DB.students=DB.students.filter(function(s){return s.id!==id;});
  saveStudentFlags();
  fbRemove('cfcParkour/extraStudents/'+id);
  if(currentPG==='personal')renderPersonalClients();else renderStudents();
}

// ─── PAYROLL ──────────────────────────────────────────────────────────────────
// ─── PAYROLL PERIOD HELPERS (26th to 25th cycle) ─────────────────────────────
// selMonth is stored as YYYY-MM where MM is the month the period ENDS
// Period: 26th of previous month → 25th of selMonth
function payrollPeriodStart(yr, mo) {
  // 26th of the month BEFORE mo
  var prevMo = mo === 1 ? 12 : mo - 1;
  var prevYr = mo === 1 ? yr - 1 : yr;
  return new Date(prevYr, prevMo - 1, 26);
}
function payrollPeriodEnd(yr, mo) {
  // 25th of mo
  return new Date(yr, mo - 1, 25);
}
function inPayrollPeriod(dateStr, yr, mo) {
  if(!dateStr) return false;
  var d = new Date(dateStr + 'T12:00:00');
  var start = payrollPeriodStart(yr, mo);
  var end   = payrollPeriodEnd(yr, mo);
  return d >= start && d <= end;
}
function payrollPeriodLabel(yr, mo) {
  var start = payrollPeriodStart(yr, mo);
  var end   = payrollPeriodEnd(yr, mo);
  var fmt = {day:'numeric',month:'long',year:'numeric'};
  return start.toLocaleDateString('en-ZA', fmt) + ' — ' + end.toLocaleDateString('en-ZA', fmt);
}
// Default payroll period: if today is 26th or later, current month end; otherwise previous month end
function defaultPayrollMonth() {
  var now = new Date();
  var d = now.getDate();
  if(d >= 26) {
    // Period ending next month's 25th
    var nextMo = now.getMonth() + 2; // getMonth is 0-indexed, +1 for 1-indexed, +1 for next
    var nextYr = now.getFullYear();
    if(nextMo > 12) { nextMo = 1; nextYr++; }
    return nextYr + '-' + String(nextMo).padStart(2,'0');
  } else {
    return now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
  }
}

// ─── AUTO-SESSION GENERATION ──────────────────────────────────────────────────
// Generate all sessions for the current month from ALL_SLOTS timetable
var DAY_NUM = {Monday:1,Tuesday:2,Wednesday:3,Thursday:4,Friday:5,Saturday:6,Sunday:0};

function getMonthSessions(year, month) {
  // Returns array of {id, playgroup, day, date, startTime, endTime, coach}
  // for every timetable slot that falls in the given month
  var sessions = [];
  // First and last day of month
  var first = new Date(year, month-1, 1);
  var last  = new Date(year, month, 0);
  
  Object.keys(ALL_SLOTS).forEach(function(pgId) {
    if(pgId === 'personal') return; // personal handled separately
    var slots = ALL_SLOTS[pgId];
    slots.forEach(function(slot) {
      var targetDay = DAY_NUM[slot.day];
      // Walk through every day of the month
      for(var d = new Date(first); d <= last; d.setDate(d.getDate()+1)) {
        if(d.getDay() === targetDay) {
          var dateStr = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
          var st = slot.startTime || slot.start || '';
          var et = slot.endTime   || slot.end   || '';
          var sid = 'sess_'+pgId+'_'+dateStr+'_'+st.replace(':','');
          sessions.push({
            id: sid,
            playgroup: pgId,
            day: slot.day,
            date: dateStr,
            startTime: st,
            endTime: et
          });
        }
      }
    });
  });
  
  // Sort by date then time
  sessions.sort(function(a,b){ return a.date.localeCompare(b.date)||a.startTime.localeCompare(b.startTime); });
  return sessions;
}

function getClaimedCoach(sessionId) {
  // Check DB.shifts for a claim on this session id
  var shift = DB.shifts.filter(function(s){ return s.id === sessionId; })[0];
  return shift ? shift.coach : null;
}

function claimSession(sessId){
  var shift = (DB.shifts||[]).filter(function(s){ return s.id===sessId; })[0];
  if(!shift){ alert('Session not found.'); return; }
  if(shift.coach){ 
    if(shift.coach===activeCoach){ alert('You already claimed this shift!'); return; }
    alert('This shift was just claimed by '+coachName(shift.coach)+'!'); 
    renderCoachPortal(); return; 
  }
  shift.coach = activeCoach;
  saveShifts();
  renderCoachPortal();
}

function unclaimSession(sessionId) {
  if(!confirm('Release this shift back to the pool?')) return;
  DB.shifts = DB.shifts.filter(function(s){ return s.id !== sessionId; });
  saveShifts();
  renderCoachPortal();
}

function getSessionMonth() {
  var now = new Date();
  return { year: now.getFullYear(), month: now.getMonth()+1 };
}

// ─── COACH PORTAL ────────────────────────────────────────────────────────────
function getUpcomingSessions(){
  var all = DB.shifts||[];
  console.log('getUpcomingSessions: DB.shifts has', all.length, 'entries');
  // Show ALL unclaimed released shifts regardless of date
  var result = all.filter(function(s){ return !s.coach; })
    .sort(function(a,b){ return (a.date||'').localeCompare(b.date||''); });
  console.log('getUpcomingSessions: returning', result.length, 'available sessions');
  return result;
}


function getSessionClaim(sessId){
  return (DB.shifts||[]).filter(function(s){ return s.id===sessId && s.coach; })[0]||null;
}

function selectActiveCoach(key){
  activeCoach=key;
  renderCoachPortal();
}

function claimSession(sessId){
  // Find the shift in DB.shifts and mark it as claimed
  var shift = (DB.shifts||[]).filter(function(s){ return s.id===sessId; })[0];
  if(!shift){ alert('Session not found.'); return; }
  if(shift.coach){ alert('This session was just claimed by '+coachName(shift.coach)+'!'); renderCoachPortal(); return; }
  shift.coach = activeCoach;
  saveShifts();
  renderCoachPortal();
}

function releaseSession(sessId){
  if(!confirm('Release this session back to the pool?')) return;
  var shift = (DB.shifts||[]).filter(function(s){ return s.id===sessId; })[0];
  if(shift){ shift.coach = null; saveShifts(); }
  renderCoachPortal();
}

// Keep old claimShift/releaseShift for backward compat
function claimShift(id){ claimSession(id); }
function releaseShift(id){ releaseSession(id); }


function claimShift(id){
  var s=DB.shifts.filter(function(x){return x.id===id;})[0];
  if(!s){return;}
  if(s.coach){alert('This shift was just claimed by someone else!');renderCoachPortal();return;}
  s.coach=activeCoach;
  saveShifts();
  renderCoachPortal();
}

function releaseShift(id){
  if(!confirm('Release this shift back to the unclaimed pool?')) return;
  var s=DB.shifts.filter(function(x){return x.id===id;})[0];
  if(s){s.coach=null; saveShifts(); renderCoachPortal();}
}

function getCoachHours(key){
  var sm=getSessionMonth();
  var sessions=getMonthSessions(sm.year,sm.month);
  return sessions.filter(function(s){return getClaimedCoach(s.id)===key&&s.startTime&&s.endTime;}).reduce(function(acc,s){
    var sh=parseInt(s.startTime.split(':')[0])*60+parseInt(s.startTime.split(':')[1]);
    var eh=parseInt(s.endTime.split(':')[0])*60+parseInt(s.endTime.split(':')[1]);
    return acc+(eh-sh)/60;
  },0);
}

function getCoachShiftSummary(key){
  var sm=getSessionMonth();
  var sessions=getMonthSessions(sm.year,sm.month);
  var claimed=sessions.filter(function(s){return getClaimedCoach(s.id)===key;}).length;
  var hrs=getCoachHours(key).toFixed(1);
  return claimed+' shifts · '+hrs+' hrs this month';
}

function renderMarkAttendance(){
  var mc=document.getElementById('mainContent'); var day=todayDay(); var date=todayDate();
  var myShifts=DB.shifts.filter(function(s){return s.coach===activeCoach&&s.day===day;});
  if(!myShifts.length){mc.innerHTML='<div class="card" style="text-align:center;padding:32px"><div style="font-size:3rem">📋</div><div style="font-weight:700;margin-top:12px">No shift today</div><div style="color:var(--sub);margin-top:6px">Contact Amanda if this is an error.</div></div>';return;}
  var html='<div class="today-header"><div class="today-date">'+day+' Session</div><div class="today-sub">'+todayFull()+'</div></div>';
  myShifts.forEach(function(shift){
    var pg=getPG(shift.playgroup); var anyDay=isAnyDay(shift.playgroup);
    var students=getStudentsForSession(shift.playgroup,date);
    html+='<div style="background:'+(pg?pg.color:'#2563eb')+';color:#fff;border-radius:10px;padding:10px 14px;margin-bottom:8px;font-weight:700">'
      +(pg?pg.emoji+' '+pg.label:'')+' · '+shift.startTime+'-'+shift.endTime

    html+='<div class="card" style="margin-bottom:16px">'
      +'<input class="search-bar" placeholder="Search..." oninput="filterCoachAtt(this.value,\''+shift.playgroup+'\',\''+date+'\',\'al_'+shift.id+'\')">'
      +'<div id="al_'+shift.id+'">'+renderCoachAttRows(students,date)+'</div></div>';
  });
  mc.innerHTML=html;
}
function filterCoachAtt(q,pgId,date,listId){
  var s=getStudentsForSession(pgId,date).filter(function(s){return fullName(s).toLowerCase().indexOf(q.toLowerCase())>=0;});
  var el=document.getElementById(listId); if(el) el.innerHTML=renderCoachAttRows(s,date);
}
function renderCoachAttRows(students,date){
  if(!students.length) return '<div style="color:var(--sub);padding:12px 0">No students for this session.</div>';
  return students.map(function(s){
    var a=DB.attendance[attKey(date,s.id)]||{};
    return '<div class="student-row" id="row_'+s.id+'">'
      +'<div style="flex:1"><div class="student-name">'+h(fullName(s))+'</div>'
      +'<div style="display:flex;gap:5px;margin-top:2px"><span class="badge blue">'+h(s.classifier)+'</span>'
      +(s.day==='any'?'<span class="badge grey">Any day</span>':'')
      +'<span style="font-size:.7rem;color:var(--sub);margin-top:3px" id="ts_'+s.id+'">'+(a.timestamp?'✓ '+a.timestamp:'Not marked')+'</span></div>'
      +'<input class="notes-input" placeholder="Notes..." value="'+h(a.notes||'')+'" onchange="updateNotes(\''+s.id+'\',\''+date+'\',this.value)"></div>'
      +'<div class="att-btns">'
      +'<button class="att-btn present'+(a.status==='present'?' active':'')+'" onclick="markAtt(\''+s.id+'\',\''+date+'\',\'present\')" id="bp_'+s.id+'">✓</button>'
      +'<button class="att-btn absent'+(a.status==='absent'?' active':'')+'" onclick="markAtt(\''+s.id+'\',\''+date+'\',\'absent\')" id="ba_'+s.id+'">✗</button>'
      +'</div></div>';
  }).join('');
}
